[project]
name = "errand"
version = "0.1.0"
description = "Chat agent that books, reschedules and cancels home-service errands against a mocked provider API"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
errand = "errand.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
